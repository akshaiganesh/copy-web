<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="heroNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.08
        0 1 0 0 0.07
        0 0 1 0 0.05
        0 0 0 0.08 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="heroNoiseFine" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="2.5" numOctaves="1" seed="13" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="
        1 0 0 0 0.12
        0 1 0 0 0.11
        0 0 1 0 0.08
        0 0 0 0.05 0"/>
    </filter>
    <mask id="noiseMask">
      <rect width="512" height="512" fill="white"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="#FBFBF8" filter="url(#heroNoise)" opacity="0.6"/>
  <rect width="512" height="512" filter="url(#heroNoiseFine)" opacity="0.35"/>
</svg>
